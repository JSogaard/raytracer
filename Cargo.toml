[package]
name = "raytracer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
image = { version = "0.25.10", features = ["rayon"] }
indicatif = "0.18.6"
rayon = "1.12.0"

[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.debug]
opt-level = 1
debug = "full"

[package]
name = "raytracer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
image = { version = "0.25.10", features = ["rayon"] }
indicatif = "0.18.6"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 2
debug = 2
